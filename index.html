<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pakistan Trading Signals — Forex, Crypto, Gold and market analysis. Learn, analyze and trade smart.">
<title>Pakistan Trading Signals | Forex • Crypto • Gold</title>
<style>
:root{
  --bg:#070b10; --card:#101720; --card2:#0c1219; --text:#f5f7fa;
  --muted:#aab4c0; --green:#20d17a; --red:#ff5b67; --line:#22303d;
  --blue:#0099FF; --blue2:#00D4FF;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{text-decoration:none;color:inherit}
.container{width:min(1120px,92%);margin:auto}
nav{position:sticky;top:0;z-index:20;background:rgba(7,11,16,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navin{height:70px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;letter-spacing:.5px}.logo span{color:var(--green)}
.navlinks{display:flex;gap:24px;color:#d7dee7;font-size:14px}
.navlinks a:hover{color:var(--green)}
.btn{display:inline-block;padding:13px 20px;border-radius:9px;font-weight:700}
.btn-green{background:var(--green);color:#04110a}.btn-outline{border:1px solid #3b4a59;color:white}
.btn-blue{background:linear-gradient(135deg, var(--blue), var(--blue2));color:white}
.hero{min-height:650px;display:flex;align-items:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(32,209,122,.09);filter:blur(80px);right:-180px;top:-80px}
.badge{display:inline-block;border:1px solid #2b5945;background:#0c1b14;color:#7ff0b2;padding:7px 12px;border-radius:30px;font-size:13px;margin-bottom:18px}
h1{font-size:clamp(42px,7vw,76px);line-height:1.03;max-width:850px}
h1 span{color:var(--green)}
.hero p{max-width:700px;color:var(--muted);font-size:18px;margin:22px 0 30px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.ticker{margin-top:55px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tick{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:12px}
.tick small{color:var(--muted)}.tick strong{display:block;font-size:22px;margin:4px 0}.up{color:var(--green)}.down{color:var(--red)}
section{padding:85px 0}.section-title{text-align:center;margin-bottom:45px}.section-title h2{font-size:38px}.section-title p{color:var(--muted);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);padding:28px;border-radius:16px}
.icon{font-size:32px;margin-bottom:12px}.card h3{font-size:21px;margin-bottom:8px}.card p{color:var(--muted)}
.analysis{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:stretch}
.chart{min-height:330px;position:relative;overflow:hidden}
.chartgrid{position:absolute;inset:20px;background-image:linear-gradient(#1c2935 1px,transparent 1px),linear-gradient(90deg,#1c2935 1px,transparent 1px);background-size:50px 50px;border-radius:10px}
.chartline{position:absolute;left:8%;right:8%;top:58%;height:3px;background:var(--green);transform:rotate(-13deg);box-shadow:0 0 12px rgba(32,209,122,.6)}
.chartline:after{content:"";position:absolute;right:0;top:-6px;border-left:12px solid var(--green);border-top:8px solid transparent;border-bottom:8px solid transparent}
.disclaimer{border-left:4px solid var(--red);background:#171016;padding:20px;border-radius:10px;color:#d9cfd2}
.cta{background:linear-gradient(135deg,#0e1b15,#101720);border:1px solid #24553e;border-radius:22px;padding:55px;text-align:center}
.cta p{color:var(--muted);margin:12px auto 25px;max-width:650px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:20px}.contact .card a{color:var(--green)}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:13px}
.footerin{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}

/* PAYMENT BOX NEW */
.payment-box{background:linear-gradient(135deg, var(--blue), var(--blue2)); border-radius:18px; padding:40px 25px; text-align:center; margin:60px auto; max-width:700px; border:2px solid var(--blue2)}
.payment-box h2{font-size:32px; margin-bottom:10px}
.payment-box p{color:#e6f7ff; margin-bottom:20px; font-size:16px}
.pay-btn{display:inline-block; background:white; color:var(--blue); padding:16px 35px; border-radius:10px; font-size:20px; font-weight:800; margin:10px; transition:0.3s}
.pay-btn:hover{transform:scale(1.05)}

@media(max-width:800px){
 .navlinks{display:none}.ticker,.grid,.analysis,.contact{grid-template-columns:1fr 1fr}
 .hero{min-height:560px}.section-title h2{font-size:31px}
@media(max-width:520px){
 .ticker,.grid,.analysis,.contact{grid-template-columns:1fr}
 section{padding:65px 0}.cta{padding:35px 20px}h1{font-size:47px}
 .payment-box h2{font-size:24px}
</style>
</head>
